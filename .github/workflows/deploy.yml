name: Deploy

# Runs once CI has passed on main, so only a tested commit reaches Azure.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    # Only pushes to this repository's main branch: never a pull request, and never a fork's branch called main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.push.outputs.api }}
      worker: ${{ steps.push.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: push
        name: Build and push both images to GitHub Container Registry
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for app in api worker; do
            docker build --target "$app" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$prefix-$app:$SHA" --tag "$prefix-$app:latest" .
            docker push --all-tags "$prefix-$app"
            echo "$app=$prefix-$app:$SHA" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: image
    # Skipped until Terraform has run and its github_variables output is in the repository variables.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_APP: ${{ vars.AZURE_API_APP }}
      WORKER_APP: ${{ vars.AZURE_WORKER_APP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # OpenID Connect: GitHub vouches for this run, so no Azure credential is stored here.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The worker first: it has to run whatever the new API starts.
      - name: Roll out the images
        env:
          API_IMAGE: ${{ needs.image.outputs.api }}
          WORKER_IMAGE: ${{ needs.image.outputs.worker }}
        run: |
          az containerapp update --name "$WORKER_APP" --resource-group "$GROUP" --image "$WORKER_IMAGE" --output none
          az containerapp update --name "$API_APP" --resource-group "$GROUP" --image "$API_IMAGE" --output none

      - name: Wait for the new revisions to be ready
        run: |
          for app in "$WORKER_APP" "$API_APP"; do
            for _ in $(seq 60); do
              ready=$(az containerapp show --name "$app" --resource-group "$GROUP" \
                --query "properties.latestRevisionName == properties.latestReadyRevisionName" --output tsv)
              [ "$ready" = "true" ] && continue 2
              sleep 5
            done
            echo "The new revision of $app was not ready within five minutes." >&2
            exit 1
          done

      - name: Run the Postman collection against Azure
        run: |
          fqdn=$(az containerapp show --name "$API_APP" --resource-group "$GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          docker run --rm -v "$PWD/postman:/etc/newman" postman/newman:6.1.3-alpine \
            run FunBooksAndVideos.postman_collection.json --env-var "baseUrl=https://$fqdn"
