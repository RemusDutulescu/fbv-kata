# Local development stack. Every credential here is a laptop-only throwaway:
# the Azure deployment authenticates with a managed identity and has no SQL password at all.

# What the api and the worker share.
x-app-environment: &app-environment
  ConnectionStrings__Shop: "Server=sqlserver,1433;Database=FunBooksAndVideos;User Id=sa;Password=Local_dev_only_1!;TrustServerCertificate=True"
  Temporal__Address: "temporal:7233"
  Temporal__Namespace: "default"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"
  OTEL_METRIC_EXPORT_INTERVAL: "5000" # every 5 s, not every minute, so the dashboard keeps up

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_dev_only_1!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Grafana, with Prometheus, Loki and Tempo behind one OTLP endpoint, and the FunBooksAndVideos dashboard.
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC, for the hosts when they run from source
    volumes:
      # One more provider beside the image's own; mounting over its folder would hide its data sources.
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/funbooksandvideos.yaml:ro
      - ./observability/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/funbooksandvideos:ro

  api:
    build:
      context: .
      target: api
    ports:
      - "5080:8080"   # API, with the docs at /scalar/
    environment:
      <<: *app-environment
      # No Temporal Cloud bill to protect locally (ADR 6), so the limit only has to stay out of the load test's way.
      RateLimiting__SubmissionsPerMinute: "10000"
    depends_on:
      sqlserver:
        condition: service_healthy
      temporal:
        condition: service_healthy
      lgtm:
        condition: service_started

  # Scales on its own: docker compose up --scale worker=3.
  worker:
    build:
      context: .
      target: worker
    environment: *app-environment
    depends_on:
      sqlserver:
        condition: service_healthy
      temporal:
        condition: service_healthy
      lgtm:
        condition: service_started

  # Load for the dashboard, run on demand: docker compose run --rm k6.
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: "http://api:8080"
    command: ["run", "/scripts/submissions.js"]
