# Local development stack. Every credential here is a laptop-only throwaway:
# the Azure deployment authenticates with a managed identity and has no SQL password at all.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_dev_only_1!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # traces UI
      - "4317:18889"  # OTLP gRPC, for the API when it runs from source

  api:
    build: .
    ports:
      - "5080:8080"   # API, with the docs at /scalar/
    environment:
      ConnectionStrings__Shop: "Server=sqlserver,1433;Database=FunBooksAndVideos;User Id=sa;Password=Local_dev_only_1!;TrustServerCertificate=True"
      Temporal__Address: "temporal:7233"
      Temporal__Namespace: "default"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://dashboard:18889"
    depends_on:
      sqlserver:
        condition: service_healthy
      temporal:
        condition: service_healthy
      dashboard:
        condition: service_started
